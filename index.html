<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Амурфиш</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="bg-glow"></div>

<header class="header">

  <div class="logo-box">

    <h1>Амурфиш</h1>

    <p>
      Свежая рыба и морепродукты
    </p>

  </div>

  <nav>

    <a href="#products">
      Каталог
    </a>

    <a
      href="https://t.me/amurfish_16_16"
      target="_blank"
    >
      Telegram
    </a>

  </nav>

</header>

<section class="hero">

  <div class="hero-content">

    <div class="hero-badge">
      🐟 PREMIUM SEAFOOD STORE
    </div>

    <h2>
      Свежая рыба и морепродукты
      премиум качества
    </h2>

    <p>
      Доставка свежей продукции,
      честные цены и premium сервис.
    </p>

    <div class="hero-buttons">

      <a
        class="hero-btn"
        href="#products"
      >
        Смотреть каталог
      </a>

      <a
        class="hero-btn secondary"
        href="https://t.me/amurfish_16_16"
        target="_blank"
      >
        Telegram
      </a>

    </div>

  </div>

</section>

<div class="layout">

  <main>

    <div class="topbar">

      <h2>Каталог</h2>

      <input
        id="search"
        placeholder="Поиск..."
        oninput="searchProducts()"
      >

    </div>

    <div id="categories"></div>

    <br>

    <div class="sort-box">

      <button onclick="sortPrice('cheap')">
        Дешёвые
      </button>

      <button onclick="sortPrice('expensive')">
        Дорогие
      </button>

    </div>

    <br><br>

    <div id="products"></div>

  </main>

  <aside>

    <h2>Корзина</h2>

    <div id="cart"></div>

    <br>

    <button
      class="checkout-btn"
      onclick="checkout()"
    >
      Оформить заказ
    </button>

  </aside>

</div>

<script src="app.js"></script>

</body>

</html>
