<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Амурфиш</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="bg-glow"></div>

<!-- HEADER -->
<header class="header">

  <div class="logo-box">

    <h1>Амурфиш</h1>

    <p>
      Premium seafood store
    </p>

  </div>

  <nav>

    <a href="#catalog">
      Каталог
    </a>

    <a
      href="https://t.me/amurfish_16_16"
      target="_blank"
    >
      Telegram
    </a>

  </nav>

</header>

<!-- HERO -->
<section class="hero">

  <div class="hero-content">

    <div class="hero-badge">
      🐟 PREMIUM SEAFOOD
    </div>

    <h2>
      Свежая рыба и морепродукты
    </h2>

    <p>
      Премиальное качество,
      охлаждение и доставка.
    </p>

    <div class="hero-buttons">

      <a
        class="hero-btn"
        href="#catalog"
      >
        Перейти в каталог
      </a>

      <a
        class="hero-btn secondary"
        href="https://t.me/amurfish_16_16"
        target="_blank"
      >
        Telegram
      </a>

    </div>

  </div>

</section>

<!-- FEATURES -->
<section class="features">

  <div class="feature-card">
    🚚 Быстрая доставка
  </div>

  <div class="feature-card">
    ❄️ Правильное хранение
  </div>

  <div class="feature-card">
    🐟 Свежий улов
  </div>

</section>

<!-- CATALOG -->
<section
  id="catalog"
  class="catalog-section"
>

  <div class="catalog-header">

    <h2>
      Каталог товаров
    </h2>

    <input
      id="search"
      placeholder="Поиск товаров..."
      oninput="searchProducts()"
    >

  </div>

  <!-- CATEGORIES -->
  <div id="categories"></div>

  <br>

  <!-- SORT -->
  <div class="sort-box">

    <button onclick="sortPrice('cheap')">
      Дешёвые
    </button>

    <button onclick="sortPrice('expensive')">
      Дорогие
    </button>

  </div>

  <br><br>

  <!-- PRODUCTS -->
  <div id="products"></div>

</section>

<!-- CART -->
<div class="cart-floating">

  <aside>

    <h2>
      Корзина
    </h2>

    <div id="cart"></div>

    <br>

    <button
      class="checkout-btn"
      onclick="checkout()"
    >
      Оформить заказ
    </button>

  </aside>

</div>

<script src="app.js"></script>

</body>

</html>
